name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install Python
        run: uv python install $(cat .python-version)

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install locked dependencies and generate legacy assets
        run: make setup

      - name: Check toolchain contract
        run: make doctor

      - name: Run local tests
        run: make test

      - name: Build legacy assets
        run: make build
