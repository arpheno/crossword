<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Black Square Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }

        .test {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .test.pass {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }

        .test.fail {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }

        .test h3 {
            margin-top: 0;
        }

        code {
            background-color: #f4f4f4;
            padding: 2px 5px;
            border-radius: 3px;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>Frontend Black Square Handling Tests</h1>
    <p>Testing the cleanAnswer() function and grid calculations</p>

    <div id="tests"></div>

    <script>
        // Import the cleanAnswer function logic
        function cleanAnswer(answer) {
            if (typeof answer !== 'string') return answer;
            return answer.replace(/[#.^,%]/g, '');
        }

        // Test cases
        const tests = [
            {
                name: 'Remove dots from answer',
                input: 'CAT...',
                expected: 'CAT',
                description: 'Should remove trailing dots'
            },
            {
                name: 'Remove hashes from answer',
                input: 'CAT###',
                expected: 'CAT',
                description: 'Should remove hashes'
            },
            {
                name: 'Remove carets (shaded squares)',
                input: 'WHOLEBEANCOF^F^E^E',
                expected: 'WHOLEBEANCOFFEE',
                description: 'Should remove caret markers for shaded squares'
            },
            {
                name: 'Remove commas (rebus squares)',
                input: 'JOHNDEEREG,R,E,E,N',
                expected: 'JOHNDEEREGREEN',
                description: 'Should remove comma separators for rebus squares'
            },
            {
                name: 'Remove percent signs (circled letters)',
                input: 'WORD%O%D',
                expected: 'WORDOD',
                description: 'Should remove percent markers for circled letters'
            },
            {
                name: 'Mixed special characters',
                input: 'MIX^E^D,T,E%S%T#.',
                expected: 'MIXEDTEST',
                description: 'Should remove all special character types'
            },
            {
                name: 'Clean answer (no special chars)',
                input: 'NORMAL',
                expected: 'NORMAL',
                description: 'Should leave normal answers unchanged'
            },
            {
                name: 'Empty string',
                input: '',
                expected: '',
                description: 'Should handle empty strings'
            }
        ];

        // Run tests
        const resultsDiv = document.getElementById('tests');
        let passCount = 0;
        let failCount = 0;

        tests.forEach((test, index) => {
            const result = cleanAnswer(test.input);
            const passed = result === test.expected;

            if (passed) passCount++;
            else failCount++;

            const testDiv = document.createElement('div');
            testDiv.className = `test ${passed ? 'pass' : 'fail'}`;
            testDiv.innerHTML = `
                <h3>${passed ? '✓' : '✗'} Test ${index + 1}: ${test.name}</h3>
                <p>${test.description}</p>
                <p><strong>Input:</strong> <code>${test.input}</code></p>
                <p><strong>Expected:</strong> <code>${test.expected}</code></p>
                <p><strong>Got:</strong> <code>${result}</code></p>
                ${!passed ? `<p style="color: red;"><strong>FAILED</strong></p>` : ''}
            `;
            resultsDiv.appendChild(testDiv);
        });

        // Summary
        const summaryDiv = document.createElement('div');
        summaryDiv.className = `test ${failCount === 0 ? 'pass' : 'fail'}`;
        summaryDiv.innerHTML = `
            <h2>Test Summary</h2>
            <p><strong>Total:</strong> ${tests.length}</p>
            <p><strong>Passed:</strong> ${passCount}</p>
            <p><strong>Failed:</strong> ${failCount}</p>
            <p><strong>Success Rate:</strong> ${((passCount / tests.length) * 100).toFixed(1)}%</p>
        `;
        resultsDiv.insertBefore(summaryDiv, resultsDiv.firstChild);

        // Grid calculation test
        const gridTestDiv = document.createElement('div');
        gridTestDiv.className = 'test pass';
        gridTestDiv.innerHTML = `
            <h2>Grid Calculation Logic</h2>
            <p>The frontend's <code>calculateGridSize()</code> method calculates grid dimensions based on word positions:</p>
            <ul>
                <li>For across words: <code>maxX = Math.max(maxX, word.x + cleanAnswer.length)</code></li>
                <li>For down words: <code>maxY = Math.max(maxY, word.y + cleanAnswer.length)</code></li>
            </ul>
            <p><strong>Result:</strong> Grid naturally excludes trailing black squares (dots/hashes) since words stop before them.</p>
            <p><strong>Example:</strong> If a puzzle has 15x15 grid in API but last column is all dots, the rendered grid will be 14x15.</p>
        `;
        resultsDiv.appendChild(gridTestDiv);
    </script>
</body>

</html>
